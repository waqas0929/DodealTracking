# JVM for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.caching=true

# Run the Kotlin compiler inside the Gradle process instead of a separate Kotlin daemon.
# This avoids the "Kotlin compile daemon terminated unexpectedly" startup crash, which is usually
# caused by a JDK/daemon mismatch or loopback/memory issues on the machine.
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
